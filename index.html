<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite stack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: rgb(52, 152, 219);
            text-align: center;
            flex-direction: row;
        }

        h2 {
            color: rgb(52, 152, 219);
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            transition: box-shadow 0.3s ease;
        }

        form:hover {
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
        }

        label {
            font-size: 1.1em;
            margin-bottom: 5px;
            display: block;
            color: rgb(52, 152, 219);
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        button {
            background-color: rgb(52, 152, 219);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1em;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: rgb(41, 122, 173);
        }

        img {
            flex-direction: column;
            height: 35px;
            margin-right: 20px;
        }

        @media (max-width: 600px) {
            form {
                padding: 15px;
            }

            input[type="text"], input[type="email"], button {
                font-size: 1em;
            }

            body {
                flex-direction: column;
                justify-content: flex-start;
            }

            img {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<img src='https://infinitestack.ai/wp-content/uploads/2024/10/IS-horizontal-PNG.png' alt='IS logo'>
<form id="redirectForm">
    <label for="name">Nome:</label>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required><br><br>

    <button type="submit">Fale conosco</button>
</form>

<script>
    document.getElementById('redirectForm').addEventListener('submit', function (event) {
        event.preventDefault();

        // Captura os valores do formulário
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;

        // Cria um objeto com os dados
        const data = {
            name: name,
            email: email
        };

        // Envia os dados para o Google Apps Script
        fetch('https://script.google.com/macros/s/AKfycbwHoMtx63DBH8xMVexpg8Z9Fn_C6aJWUu9IsbcYQvK4zX3TPp0xgHgM2aSZVd1TUxeo8g/exec', {
            method: 'POST',
            body: JSON.stringify(data),
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            console.log('Status:', response.status); // Verifique o status da resposta
            if (!response.ok) {
                throw new Error('Erro na requisição: ' + response.statusText);
            }
            return response.json(); // Parseia a resposta como JSON
        })
        .then(data => {
            console.log('Success:', data);

            // Redireciona para o WhatsApp após o envio bem-sucedido
            const phoneNumber = '11974403167'; // Adicione o número de telefone aqui
            const message = `Olá, meu nome é ${name} e gostaria de saber mais sobre a Infinite Stack. Poderia me passar mais informações?`;
            const waLink = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.location.href = waLink;
        })
        .catch((error) => {
            console.error('Error:', error);
            alert('Ocorreu um erro ao enviar o formulário. Tente novamente.');
        });
    });
</script>

</body>
</html>
