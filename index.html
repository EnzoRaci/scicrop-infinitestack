<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionamento Dinâmico</title>
</head>
<body>

<h2>Preencha seus dados antes de prosseguir:</h2>
<form id="redirectForm">
    <label for="name">Nome:</label>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required><br><br>

    <button type="submit">Acessar WhatsApp</button>
</form>

<script>
    document.getElementById('redirectForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const name = encodeURIComponent(document.getElementById('name').value);
        const email = encodeURIComponent(document.getElementById('email').value);
        
        const phoneNumber = '5511933393672'; // Altere para o número correto
        const message = `Olá, meu nome é ${name} e meu email é ${email}. Gostaria de saber mais sobre o Infinite-stack.`;
        const waLink = `https://wa.me/${phoneNumber}?text=${message}`;

        // Redireciona diretamente para o WhatsApp (ou para o Linktree se preferir)
        window.location.href = waLink;
    });
</script>

</body>
</html>
