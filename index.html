<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite stack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff; /* Fundo branco */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: rgb(52, 152, 219); /* Cor das letras */
            text-align: center;
            flex-direction: row;
        }

        h2 {
            color: rgb(52, 152, 219); /* Cor do título */
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            transition: box-shadow 0.3s ease;
        }

        form:hover {
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
        }

        label {
            font-size: 1.1em;
            margin-bottom: 5px;
            display: block;
            color: rgb(52, 152, 219);
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        button {
            background-color: rgb(52, 152, 219);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1em;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: rgb(41, 122, 173);
        }

        img {
            flex-direction: column;
            height: 35px;
            margin-right: 20px;
        }

        /* Responsivo */
        @media (max-width: 600px) {
            form {
                padding: 15px;
            }

            input[type="text"], input[type="email"], button {
                font-size: 1em;
            }

            body {
                flex-direction: column;
                justify-content: flex-start;
            }

            img {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<img src='https://infinitestack.ai/wp-content/uploads/2024/10/IS-horizontal-PNG.png' alt='IS logo'>
<form id="redirectForm">
    <label for="name">Nome:</label>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required><br><br>

    <button type="submit">Fale conosco</button>
    <a href='https://infinitestack.ai/'>Fale conosco</a>
</form>

<script>
    document.getElementById('redirectForm').addEventListener('submit', function (event) {
    event.preventDefault();

    const name = encodeURIComponent(document.getElementById('name').value);
    const email = encodeURIComponent(document.getElementById('email').value);
    
    const phoneNumber = '5511974403167';
    const message = `Olá, meu nome é ${name} e gostaria de saber mais sobre a Infinite Stack. Poderia me passar mais informações ou enviá-las para ${email}?`;
    const waLink = `https://wa.me/${phoneNumber}?text=${message}`;

    window.location.href = waLink;
});
</script>

</body>
</html>
